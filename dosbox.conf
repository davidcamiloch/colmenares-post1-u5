# dosbox.conf - configuracion del laboratorio colmenares-post1-u5
# Uso: dosbox.exe -conf dosbox.conf (desde la carpeta del laboratorio)

[cpu]
core=normal
cputype=auto
cycles=8000

[dosbox]
memsize=16

[render]
scaler=normal2x

[autoexec]
mount c "C:\Users\Camilo Colmenares\contenidos arq\lab-post1-u5"
c:
cwsdpmi -p
echo DOSBox listo. Directorio de trabajo: C:\
